<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>7d 配额同步设置</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,"Microsoft YaHei",sans-serif;--accent:#2563eb;--border:#cbd5e1;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;padding:18px;background:transparent;color:inherit}.panel{max-width:780px;margin:auto}
    .notice{padding:12px 14px;border:1px solid #f59e0b;border-radius:10px;background:color-mix(in srgb,#f59e0b 12%,transparent);line-height:1.6;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.wide{grid-column:1/-1}
    label{font-size:14px;font-weight:600}input,select{padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:transparent;color:inherit;font:inherit}
    .hint{font-size:12px;color:var(--muted);line-height:1.5}.checks{display:flex;flex-wrap:wrap;gap:16px;padding:10px 0}.check{display:flex;align-items:center;gap:7px;font-weight:500}.check input{width:auto}
    .option-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:4px 0}.option{display:flex;align-items:flex-start;gap:9px;padding:10px;border:1px solid var(--border);border-radius:8px;font-weight:500}.option input{margin-top:2px}.option-text{min-width:0}.option-title{display:block;overflow-wrap:anywhere}.option-meta{display:block;margin-top:3px;color:var(--muted);font-size:12px;font-weight:400}.empty{padding:10px 0;color:var(--muted);font-size:13px}
    .actions{display:flex;gap:10px;margin-top:18px}button{border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#e2e8f0;color:#0f172a}
    button:disabled{opacity:.55;cursor:wait}.status{min-height:24px;margin-top:12px;font-size:14px}.ok{color:#16a34a}.error{color:#dc2626}
    h2{margin:0 0 14px;font-size:20px}@media(max-width:620px){.grid,.option-list{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body>
<main class="panel">
  <h2>账号 7d → 订阅配额同步</h2>
  <div class="notice">实际同步只由下方“启用自动同步”控制，插件卡片的宿主“启用”不是必需操作；误启用时会使用兼容 HTTP 流式透传，避免请求中断。</div>
  <div class="grid">
    <div class="field wide"><label>账号</label><div class="option-list" id="accountOptions"><div class="empty">正在读取账号...</div></div><span class="hint">可多选；任一所选账号进入新的 7d 周期时触发同步。</span></div>
    <div class="field wide" id="groupField"><label>目标分组</label><div class="option-list" id="groupOptions"><div class="empty">正在读取订阅分组...</div></div><span class="hint">可多选；仅显示当前有效的订阅分组。</span></div>
    <div class="field wide"><label>运行模式</label><div class="checks"><label class="check"><input id="enabled" type="checkbox">启用自动同步</label><label class="check"><input id="dryRun" type="checkbox">演练模式</label></div><span class="hint">建议先演练；演练不会重置配额。</span></div>
    <div class="field wide"><label for="mode">同步模式</label><select id="mode"><option value="subscription">订阅模式</option><option value="balance">余额模式</option></select><span class="hint" id="balanceHint" style="display:none">余额模式读取全部有效用户的属性 SubscriptionLimit，把余额重置为该值；未填写属性的用户会被跳过。注意：仍处于有效订阅中的用户计费走订阅窗口，余额不会被消耗。</span></div>
    <div class="field wide" id="windowField"><label>重置窗口</label><div class="checks"><label class="check"><input id="daily" type="checkbox">日配额</label><label class="check"><input id="weekly" type="checkbox">周配额</label><label class="check"><input id="monthly" type="checkbox">月配额</label></div></div>
    <div class="field"><label for="shift">新周期最小跳变（小时）</label><input id="shift" type="number" min="24" max="192" step="1"><span class="hint">默认 24 小时，过滤小幅漂移。</span></div>
    <div class="field"><label for="rearm">新周期最小剩余时间（小时）</label><input id="rearm" type="number" min="24" max="168" step="1"><span class="hint">默认 120 小时，确认倒计时已重新充满。</span></div>
    <div class="field"><label for="jitter">时间抖动容差（小时）</label><input id="jitter" type="number" min="0" max="24" step="1"><span class="hint">默认 6 小时。</span></div>
  </div>
  <div class="actions"><button class="primary" id="save">保存设置</button><button class="secondary" id="refresh">刷新选项</button><button class="secondary" id="test">测试已保存配置</button></div>
  <div class="status" id="status"></div>
</main>
<script>
(() => {
  'use strict';
  const token = new URLSearchParams(location.hash.slice(1)).get('bridge_token') || '';
  const pending = new Map(); let seq = 0; let currentConfig = null; let catalog = {accounts:[],groups:[]};
  const $ = id => document.getElementById(id); const status = $('status');
  function notify(text, ok=true){ status.textContent=text; status.className='status '+(ok?'ok':'error'); resize(); }
  function request(type, payload={}){ return new Promise((resolve,reject)=>{ const request_id=`qsync-${Date.now()}-${++seq}`; const timer=setTimeout(()=>{pending.delete(request_id);reject(new Error('操作超时'));},15000); pending.set(request_id,{resolve,reject,timer}); parent.postMessage({source:'sub2api-plugin-ui',bridge_token:token,type,request_id,...payload},'*'); }); }
  addEventListener('message', event => { const d=event.data; if(event.source!==parent||!d||d.source!=='sub2api-plugin-host'||d.bridge_token!==token||!pending.has(d.request_id))return; const p=pending.get(d.request_id);pending.delete(d.request_id);clearTimeout(p.timer);d.ok?p.resolve(d):p.reject(new Error(d.error||d.message||'操作失败')); });
  function defaults(){return{enabled:false,dry_run:true,mode:'subscription',account_ids:[1],target_groups:[],reset_daily:false,reset_weekly:true,reset_monthly:false,min_cycle_shift_seconds:86400,rearm_remaining_seconds:432000,jitter_tolerance_seconds:21600};}
  function selectedAccountIDs(c){return(c.account_ids||[c.account_id]).filter(Number.isFinite).map(Number);}
  function selectedGroupIDs(c){const selected=new Set();for(const value of c.target_groups||[]){const match=catalog.groups.find(g=>String(g.id)===String(value)||g.name===String(value));if(match)selected.add(Number(match.id));}return selected;}
  function option(container,inputType,name,value,title,meta,checked,disabled=false){const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type=inputType;input.name=name;input.value=String(value);input.checked=checked;input.disabled=disabled;const text=document.createElement('span');text.className='option-text';const heading=document.createElement('span');heading.className='option-title';heading.textContent=title;const detail=document.createElement('span');detail.className='option-meta';detail.textContent=meta;text.append(heading,detail);label.append(input,text);container.append(label);}
  function renderOptions(){if(!currentConfig)return;const accountBox=$('accountOptions');const groupBox=$('groupOptions');accountBox.replaceChildren();groupBox.replaceChildren();const selectedAccounts=new Set(selectedAccountIDs(currentConfig));for(const account of catalog.accounts||[]){option(accountBox,'checkbox','account',account.id,account.label||account.name,`ID ${account.id} · ${account.status}${account.schedulable?' · 可调度':''}`,selectedAccounts.has(Number(account.id)),account.status!=='active');}if(!accountBox.children.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='暂无可选 OpenAI OAuth 账号';accountBox.append(empty);}const selectedGroups=selectedGroupIDs(currentConfig);for(const group of catalog.groups||[]){option(groupBox,'checkbox','targetGroup',group.id,group.name,`ID ${group.id}`,selectedGroups.has(Number(group.id)));}if(!groupBox.children.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='暂无有效订阅分组';groupBox.append(empty);}resize();}
  function fill(raw){const migrated={...(raw||{})};if(!migrated.account_ids&&migrated.account_id)migrated.account_ids=[migrated.account_id];currentConfig={...defaults(),...migrated};if(currentConfig.catalog)catalog=currentConfig.catalog;$('enabled').checked=!!currentConfig.enabled;$('dryRun').checked=!!currentConfig.dry_run;$('mode').value=currentConfig.mode==='balance'?'balance':'subscription';syncBalanceHint();$('daily').checked=!!currentConfig.reset_daily;$('weekly').checked=!!currentConfig.reset_weekly;$('monthly').checked=!!currentConfig.reset_monthly;$('shift').value=currentConfig.min_cycle_shift_seconds/3600;$('rearm').value=currentConfig.rearm_remaining_seconds/3600;$('jitter').value=currentConfig.jitter_tolerance_seconds/3600;renderOptions();}
  function collect(){return{enabled:$('enabled').checked,dry_run:$('dryRun').checked,mode:$('mode').value,account_ids:[...document.querySelectorAll('input[name="account"]:checked')].map(i=>Number(i.value)),target_groups:[...document.querySelectorAll('input[name="targetGroup"]:checked')].map(i=>i.value),reset_daily:$('daily').checked,reset_weekly:$('weekly').checked,reset_monthly:$('monthly').checked,min_cycle_shift_seconds:Number($('shift').value)*3600,rearm_remaining_seconds:Number($('rearm').value)*3600,jitter_tolerance_seconds:Number($('jitter').value)*3600};}
  function syncBalanceHint(){const balance=$('mode').value==='balance';$('balanceHint').style.display=balance?'':'none';$('groupField').style.display=balance?'none':'';$('windowField').style.display=balance?'none':'';resize();}
  $('mode').onchange=syncBalanceHint;
  function busy(value){$('save').disabled=value;$('refresh').disabled=value;$('test').disabled=value;}
  function resize(){parent.postMessage({source:'sub2api-plugin-ui',bridge_token:token,type:'ui.resize',request_id:`resize-${Date.now()}`,height:Math.ceil(document.documentElement.scrollHeight+8)},'*');}
  $('save').onclick=async()=>{busy(true);try{const r=await request('config.save',{config:collect()});fill(r.config);notify('设置已保存，后台执行器将在下一分钟读取。');}catch(e){notify(e.message,false);}finally{busy(false);}};
  $('refresh').onclick=async()=>{busy(true);try{const r=await request('config.save',{config:collect()});fill(r.config);notify('账号与分组选项已刷新。');}catch(e){notify(e.message,false);}finally{busy(false);}};
  $('test').onclick=async()=>{busy(true);try{const r=await request('config.test');notify(r.result?.message||'测试通过',r.result?.success!==false);}catch(e){notify(e.message,false);}finally{busy(false);}};
  parent.postMessage({source:'sub2api-plugin-ui',bridge_token:token,type:'sub2api.plugin.ready',request_id:`ready-${Date.now()}`},'*');
  request('config.load').then(r=>fill(r.config)).catch(e=>{fill({});notify(e.message,false);});
  addEventListener('load',resize); new ResizeObserver(resize).observe(document.body);
})();
</script>
</body>
</html>
